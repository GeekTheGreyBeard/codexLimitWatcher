<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Limit Watcher</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Codex Limit Watcher</h1>
          <p id="subtitle">Waiting for usage data</p>
        </div>
        <div class="actions">
          <button id="signInButton" title="Sign in with ChatGPT" aria-label="Sign in with ChatGPT">Sign in</button>
          <button id="signOutButton" title="Sign out" aria-label="Sign out" disabled>Sign out</button>
          <button id="refreshButton" title="Refresh usage data" aria-label="Refresh usage data">Refresh</button>
          <button id="miniModeButton" title="Toggle mini mode" aria-label="Toggle mini mode">Mini</button>
          <button id="aboutButton" title="About Codex Limit Watcher" aria-label="About Codex Limit Watcher">About</button>
        </div>
      </header>
      <section class="controls" aria-label="Display and refresh controls">
        <label class="control-check">
          <input id="autoRefreshToggle" type="checkbox">
          <span>Auto-refresh</span>
        </label>
        <label class="control-select">
          <span>Interval</span>
          <select id="refreshIntervalSelect">
            <option value="1">1m</option>
            <option value="5">5m</option>
            <option value="10">10m</option>
            <option value="15">15m</option>
            <option value="30">30m</option>
          </select>
        </label>
        <label class="control-check">
          <input id="darkModeToggle" type="checkbox">
          <span>Dark mode</span>
        </label>
      </section>
      <section id="statusBanner" class="status-banner">Loading Codex usage state</section>
      <section id="windowGrid" class="window-grid"></section>
      <section class="details compact">
        <div>
          <h2>Account</h2>
          <p id="scanText">Signed out</p>
        </div>
        <button id="showAccountButton" disabled>Show Account Number</button>
      </section>
    </main>
    <dialog id="aboutDialog" class="about-dialog" aria-labelledby="aboutTitle">
      <form method="dialog">
        <div class="about-head">
          <h2 id="aboutTitle">Codex Limit Watcher</h2>
          <button class="icon-button" value="cancel" title="Close" aria-label="Close About dialog">X</button>
        </div>
        <p>Desktop watcher for Codex usage-limit reset windows.</p>
        <div class="about-links">
          <button type="button" data-url="https://github.com/GeekTheGreyBeard">GitHub Profile</button>
          <button type="button" data-url="https://reesadmin.com">ReesAdmin.com</button>
        </div>
      </form>
    </dialog>
    <script src="./renderer.js"></script>
  </body>
</html>
